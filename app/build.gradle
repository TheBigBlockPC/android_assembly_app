plugins { id 'com.android.application' }
android {
    namespace 'dev.armstudio'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'dev.armstudio'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++20 -Wall -Wextra'; arguments '-DANDROID_STL=c++_static' } }
        testInstrumentationRunner 'dev.armstudio.SmokeInstrumentation'
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { release { minifyEnabled false } }
}
